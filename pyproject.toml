[project]
name = "newcoin-trader"
version = "0.1.0"
description = "Paper-only research platform for newly listed assets and Solana meme coins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "newcoin-trader research" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pandas>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
newcoin-trader = "newcoin_trader.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newcoin_trader"]

[tool.hatch.build.targets.wheel.force-include]
"src/newcoin_trader/resources/demo_run/meta.json" = "newcoin_trader/resources/demo_run/meta.json"
"src/newcoin_trader/resources/demo_run/snapshots.json" = "newcoin_trader/resources/demo_run/snapshots.json"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]
"src/newcoin_trader/cli/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["newcoin_trader"]
strict = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
