services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newcoin
      POSTGRES_PASSWORD: newcoin
      POSTGRES_DB: newcoin
    ports:
      - "5432:5432"
    volumes:
      - newcoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newcoin -d newcoin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newcoin_pgdata:
